probe_name: "kubernetes"
friendly_name: "Kubernetes"
version: "1.0.0"
host_level: false
multi_instance_labels: ["k8s.node.name", "k8s.pod.name", "k8s.namespace.name", "k8s.container.name", "k8s.deployment.name"]

# FREE probe — Kubernetes cluster supervision via the API server.
# Covers nodes, pods, containers, and deployments.
# OTel metric names follow the k8s.* namespace aligned with the
# OpenTelemetry Kubernetes semantic conventions (semconv 1.30+).

metrics:
  # --- Availability (tags: k8s.cluster.name) ---

  - name: "senhub.kubernetes.up"
    channel: "k8s_cluster_up"
    display_name: "Kubernetes API reachable"
    unit: "#"
    category: "availability"
    description: "1 when at least one API list succeeded this cycle, 0 when the API server was unreachable or returned an error"
    otel:
      name: senhub.kubernetes.up
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name

  # --- Node metrics (tags: k8s.node.name, k8s.cluster.name) ---

  - name: "k8s.node.ready"
    channel: "k8s_node_{k8s.node.name}_ready"
    display_name: "Node {k8s.node.name} Ready"
    unit: "#"
    category: "node"
    description: "1 when the node reports Ready condition True, 0 otherwise"
    otel:
      name: k8s.node.ready
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  - name: "k8s.node.cpu.allocatable"
    channel: "k8s_node_{k8s.node.name}_cpu_allocatable"
    display_name: "Node {k8s.node.name} Allocatable CPUs"
    unit: "#"
    category: "node"
    description: "Number of allocatable CPU cores on the node"
    otel:
      name: k8s.node.cpu.allocatable
      unit: "{core}"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  - name: "k8s.node.memory.allocatable"
    channel: "k8s_node_{k8s.node.name}_memory_allocatable"
    display_name: "Node {k8s.node.name} Allocatable Memory"
    unit: "B"
    category: "node"
    description: "Allocatable memory on the node in bytes"
    otel:
      name: k8s.node.memory.allocatable
      unit: "By"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  - name: "k8s.node.pods.capacity"
    channel: "k8s_node_{k8s.node.name}_pods_capacity"
    display_name: "Node {k8s.node.name} Pod Capacity"
    unit: "#"
    category: "node"
    description: "Maximum number of pods the node can host"
    otel:
      name: k8s.node.pods.capacity
      unit: "{pod}"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  - name: "k8s.node.pods.allocatable"
    channel: "k8s_node_{k8s.node.name}_pods_allocated"
    display_name: "Node {k8s.node.name} Pods Allocatable"
    unit: "#"
    category: "node"
    description: "Number of pods that can still be scheduled on the node"
    otel:
      name: k8s.node.pods.allocatable
      unit: "{pod}"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  # --- Pod metrics (tags: k8s.pod.name, k8s.namespace.name, k8s.node.name) ---

  - name: "k8s.pod.phase"
    channel: "k8s_pod_{k8s.namespace.name}_{k8s.pod.name}_phase"
    display_name: "Pod {k8s.namespace.name}/{k8s.pod.name} Running"
    unit: "#"
    category: "pod"
    description: "1 when the pod phase is Running, 0 otherwise"
    otel:
      name: k8s.pod.phase
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.node.name: k8s.node.name

  - name: "k8s.pod.ready"
    channel: "k8s_pod_{k8s.namespace.name}_{k8s.pod.name}_ready"
    display_name: "Pod {k8s.namespace.name}/{k8s.pod.name} Ready"
    unit: "#"
    category: "pod"
    description: "1 when the pod Ready condition is True"
    otel:
      name: k8s.pod.ready
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.node.name: k8s.node.name

  - name: "k8s.pod.restarts"
    channel: "k8s_pod_{k8s.namespace.name}_{k8s.pod.name}_restarts"
    display_name: "Pod {k8s.namespace.name}/{k8s.pod.name} Restarts"
    unit: "#"
    category: "pod"
    description: "Total container restart count for the pod"
    otel:
      name: k8s.pod.restarts
      unit: "{restart}"
      type: counter
    tag_to_attribute:
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.node.name: k8s.node.name

  # --- Container metrics (tags: k8s.container.name, k8s.pod.name, k8s.namespace.name) ---

  - name: "k8s.container.ready"
    channel: "k8s_container_{k8s.namespace.name}_{k8s.pod.name}_{k8s.container.name}_ready"
    display_name: "Container {k8s.namespace.name}/{k8s.pod.name}/{k8s.container.name} Ready"
    unit: "#"
    category: "container"
    description: "1 when the container is in a ready state"
    otel:
      name: k8s.container.ready
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.container.name: k8s.container.name
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name

  - name: "k8s.container.restarts"
    channel: "k8s_container_{k8s.namespace.name}_{k8s.pod.name}_{k8s.container.name}_restarts"
    display_name: "Container {k8s.namespace.name}/{k8s.pod.name}/{k8s.container.name} Restarts"
    unit: "#"
    category: "container"
    description: "Number of times the container has been restarted"
    otel:
      name: k8s.container.restarts
      unit: "{restart}"
      type: counter
    tag_to_attribute:
      k8s.container.name: k8s.container.name
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name

  # --- Deployment metrics (tags: k8s.deployment.name, k8s.namespace.name) ---

  - name: "k8s.deployment.available"
    channel: "k8s_deployment_{k8s.namespace.name}_{k8s.deployment.name}_available"
    display_name: "Deployment {k8s.namespace.name}/{k8s.deployment.name} Available"
    unit: "#"
    category: "deployment"
    description: "Number of available (ready) replicas for the deployment"
    otel:
      name: k8s.deployment.available
      unit: "{pod}"
      type: gauge
    tag_to_attribute:
      k8s.deployment.name: k8s.deployment.name
      k8s.namespace.name: k8s.namespace.name

  - name: "k8s.deployment.desired"
    channel: "k8s_deployment_{k8s.namespace.name}_{k8s.deployment.name}_desired"
    display_name: "Deployment {k8s.namespace.name}/{k8s.deployment.name} Desired"
    unit: "#"
    category: "deployment"
    description: "Desired replica count for the deployment (spec.replicas)"
    otel:
      name: k8s.deployment.desired
      unit: "{pod}"
      type: gauge
    tag_to_attribute:
      k8s.deployment.name: k8s.deployment.name
      k8s.namespace.name: k8s.namespace.name

  - name: "k8s.deployment.ready"
    channel: "k8s_deployment_{k8s.namespace.name}_{k8s.deployment.name}_ready"
    display_name: "Deployment {k8s.namespace.name}/{k8s.deployment.name} Ready"
    unit: "#"
    category: "deployment"
    description: "1 when available replicas >= desired replicas, 0 otherwise"
    otel:
      name: k8s.deployment.ready
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.deployment.name: k8s.deployment.name
      k8s.namespace.name: k8s.namespace.name

  # --- Node conditions (#756) — 1 means the pressure IS present ---

  - name: "k8s.node.condition.memory_pressure"
    channel: "k8s_node_{k8s.node.name}_memory_pressure"
    display_name: "Node {k8s.node.name} Memory Pressure"
    unit: "#"
    category: "node"
    description: "1 when the node reports the Memory Pressure condition True, 0 otherwise. Note the polarity is the opposite of k8s.node.ready: here 1 is the bad state"
    otel:
      name: k8s.node.condition.memory_pressure
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  - name: "k8s.node.condition.disk_pressure"
    channel: "k8s_node_{k8s.node.name}_disk_pressure"
    display_name: "Node {k8s.node.name} Disk Pressure"
    unit: "#"
    category: "node"
    description: "1 when the node reports the Disk Pressure condition True, 0 otherwise. Note the polarity is the opposite of k8s.node.ready: here 1 is the bad state"
    otel:
      name: k8s.node.condition.disk_pressure
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  - name: "k8s.node.condition.pid_pressure"
    channel: "k8s_node_{k8s.node.name}_pid_pressure"
    display_name: "Node {k8s.node.name} PID Pressure"
    unit: "#"
    category: "node"
    description: "1 when the node reports the PID Pressure condition True, 0 otherwise. Note the polarity is the opposite of k8s.node.ready: here 1 is the bad state"
    otel:
      name: k8s.node.condition.pid_pressure
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  - name: "k8s.node.condition.network_unavailable"
    channel: "k8s_node_{k8s.node.name}_network_unavailable"
    display_name: "Node {k8s.node.name} Network Unavailable"
    unit: "#"
    category: "node"
    description: "1 when the node reports the Network Unavailable condition True, 0 otherwise. Note the polarity is the opposite of k8s.node.ready: here 1 is the bad state"
    otel:
      name: k8s.node.condition.network_unavailable
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.node.name: k8s.node.name
      k8s.cluster.name: k8s.cluster.name

  # --- Pod and container resource reservations (#756) ---

  - name: "k8s.pod.cpu.request"
    channel: "k8s_pod_{k8s.pod.name}_cpu_request"
    display_name: "Pod {k8s.pod.name} CPU Request"
    unit: "cores"
    category: "resources"
    description: "CPU Request summed over the pod's containers, init containers excluded (they do not hold their reservation for the pod's life)"
    otel:
      name: k8s.pod.cpu.request
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.node.name: k8s.node.name

  - name: "k8s.pod.cpu.limit"
    channel: "k8s_pod_{k8s.pod.name}_cpu_limit"
    display_name: "Pod {k8s.pod.name} CPU Limit"
    unit: "cores"
    category: "resources"
    description: "CPU Limit summed over the pod's containers, init containers excluded (they do not hold their reservation for the pod's life)"
    otel:
      name: k8s.pod.cpu.limit
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.node.name: k8s.node.name

  - name: "k8s.pod.memory.request"
    channel: "k8s_pod_{k8s.pod.name}_memory_request"
    display_name: "Pod {k8s.pod.name} Memory Request"
    unit: "bytes"
    category: "resources"
    description: "Memory Request summed over the pod's containers, init containers excluded"
    otel:
      name: k8s.pod.memory.request
      unit: "By"
      type: gauge
    tag_to_attribute:
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.node.name: k8s.node.name

  - name: "k8s.pod.memory.limit"
    channel: "k8s_pod_{k8s.pod.name}_memory_limit"
    display_name: "Pod {k8s.pod.name} Memory Limit"
    unit: "bytes"
    category: "resources"
    description: "Memory Limit summed over the pod's containers, init containers excluded"
    otel:
      name: k8s.pod.memory.limit
      unit: "By"
      type: gauge
    tag_to_attribute:
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.node.name: k8s.node.name

  - name: "k8s.container.cpu.request"
    channel: "k8s_container_{k8s.container.name}_cpu_request"
    display_name: "Container {k8s.container.name} CPU Request"
    unit: "cores"
    category: "resources"
    description: "CPU Request declared by this container"
    otel:
      name: k8s.container.cpu.request
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.container.name: k8s.container.name
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name

  - name: "k8s.container.cpu.limit"
    channel: "k8s_container_{k8s.container.name}_cpu_limit"
    display_name: "Container {k8s.container.name} CPU Limit"
    unit: "cores"
    category: "resources"
    description: "CPU Limit declared by this container"
    otel:
      name: k8s.container.cpu.limit
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.container.name: k8s.container.name
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name

  - name: "k8s.container.memory.request"
    channel: "k8s_container_{k8s.container.name}_memory_request"
    display_name: "Container {k8s.container.name} Memory Request"
    unit: "bytes"
    category: "resources"
    description: "Memory Request declared by this container"
    otel:
      name: k8s.container.memory.request
      unit: "By"
      type: gauge
    tag_to_attribute:
      k8s.container.name: k8s.container.name
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name

  - name: "k8s.container.memory.limit"
    channel: "k8s_container_{k8s.container.name}_memory_limit"
    display_name: "Container {k8s.container.name} Memory Limit"
    unit: "bytes"
    category: "resources"
    description: "Memory Limit declared by this container"
    otel:
      name: k8s.container.memory.limit
      unit: "By"
      type: gauge
    tag_to_attribute:
      k8s.container.name: k8s.container.name
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name

  - name: "k8s.container.waiting"
    channel: "k8s_container_{k8s.container.name}_waiting"
    display_name: "Container {k8s.container.name} Waiting"
    unit: "#"
    category: "container"
    description: "1 while the container is in a waiting state; the reason attribute distinguishes CrashLoopBackOff from ImagePullBackOff, which call for opposite reactions"
    otel:
      name: k8s.container.waiting
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.container.name: k8s.container.name
      k8s.pod.name: k8s.pod.name
      k8s.namespace.name: k8s.namespace.name
      k8s.container.waiting.reason: k8s.container.waiting.reason

  # --- Workload kinds beyond Deployment (#756) ---

  - name: "k8s.statefulset.desired"
    channel: "k8s_statefulset_{k8s.workload.name}_desired"
    display_name: "Statefulset {k8s.workload.name} desired"
    unit: "#"
    category: "workload"
    description: "desired count for this statefulset"
    otel:
      name: k8s.statefulset.desired
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.statefulset.ready"
    channel: "k8s_statefulset_{k8s.workload.name}_ready"
    display_name: "Statefulset {k8s.workload.name} ready"
    unit: "#"
    category: "workload"
    description: "ready count for this statefulset"
    otel:
      name: k8s.statefulset.ready
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.statefulset.current"
    channel: "k8s_statefulset_{k8s.workload.name}_current"
    display_name: "Statefulset {k8s.workload.name} current"
    unit: "#"
    category: "workload"
    description: "current count for this statefulset"
    otel:
      name: k8s.statefulset.current
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.statefulset.updated"
    channel: "k8s_statefulset_{k8s.workload.name}_updated"
    display_name: "Statefulset {k8s.workload.name} updated"
    unit: "#"
    category: "workload"
    description: "updated count for this statefulset"
    otel:
      name: k8s.statefulset.updated
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.daemonset.desired_scheduled"
    channel: "k8s_daemonset_{k8s.workload.name}_desired_scheduled"
    display_name: "Daemonset {k8s.workload.name} desired scheduled"
    unit: "#"
    category: "workload"
    description: "desired scheduled count for this daemonset"
    otel:
      name: k8s.daemonset.desired_scheduled
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.daemonset.current_scheduled"
    channel: "k8s_daemonset_{k8s.workload.name}_current_scheduled"
    display_name: "Daemonset {k8s.workload.name} current scheduled"
    unit: "#"
    category: "workload"
    description: "current scheduled count for this daemonset"
    otel:
      name: k8s.daemonset.current_scheduled
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.daemonset.ready"
    channel: "k8s_daemonset_{k8s.workload.name}_ready"
    display_name: "Daemonset {k8s.workload.name} ready"
    unit: "#"
    category: "workload"
    description: "ready count for this daemonset"
    otel:
      name: k8s.daemonset.ready
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.daemonset.misscheduled"
    channel: "k8s_daemonset_{k8s.workload.name}_misscheduled"
    display_name: "Daemonset {k8s.workload.name} misscheduled"
    unit: "#"
    category: "workload"
    description: "misscheduled count for this daemonset"
    otel:
      name: k8s.daemonset.misscheduled
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.replicaset.desired"
    channel: "k8s_replicaset_{k8s.workload.name}_desired"
    display_name: "Replicaset {k8s.workload.name} desired"
    unit: "#"
    category: "workload"
    description: "desired count for this replicaset"
    otel:
      name: k8s.replicaset.desired
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.replicaset.ready"
    channel: "k8s_replicaset_{k8s.workload.name}_ready"
    display_name: "Replicaset {k8s.workload.name} ready"
    unit: "#"
    category: "workload"
    description: "ready count for this replicaset"
    otel:
      name: k8s.replicaset.ready
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.replicaset.available"
    channel: "k8s_replicaset_{k8s.workload.name}_available"
    display_name: "Replicaset {k8s.workload.name} available"
    unit: "#"
    category: "workload"
    description: "available count for this replicaset"
    otel:
      name: k8s.replicaset.available
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
      k8s.namespace.name: k8s.namespace.name
      k8s.workload.kind: k8s.workload.kind
      k8s.workload.name: k8s.workload.name

  - name: "k8s.job.active"
    channel: "k8s_job_{k8s.workload.name}_active"
    display_name: "Job {k8s.workload.name} active"
    unit: "#"
    category: "workload"
    description: "active count for this job"
    otel:
      name: k8s.job.active
      unit: "1"
      type: gauge
    tag_to_attribute:
      k8s.cluster.name: k8s.cluster.name
