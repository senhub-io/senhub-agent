{{- if .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "senhub-agent.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "senhub-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secrets.values }}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $k) }}
  {{- fail (printf "secrets.values key %q is not an environment variable name" $k) }}
  {{- end }}
  {{ $k }}: {{ toString $v | b64enc | quote }}
  {{- end }}
{{- end }}
