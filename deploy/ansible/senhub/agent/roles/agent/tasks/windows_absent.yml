---
- name: Find the installed MSI
  ansible.windows.win_shell: |
    $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    Get-ItemProperty $keys -ErrorAction SilentlyContinue |
      Where-Object { $_.DisplayName -eq 'SenHub Agent' -and $_.PSChildName -match '^\{' } |
      Select-Object -First 1 -ExpandProperty PSChildName
  register: _senhub_agent_product
  changed_when: false

- name: Uninstall the MSI
  ansible.windows.win_package:
    product_id: "{{ _senhub_agent_product.stdout | trim }}"
    state: absent
  when: _senhub_agent_product.stdout | trim | length > 0
