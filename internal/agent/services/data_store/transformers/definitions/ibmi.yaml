    prtg_skip: true
    unit: "#"
    category: "events"
    description: "An entry was written to the audit journal"
    otel:
      skip: true
      reason: "Event conduit — relayed QAUDJRN entry. Not meaningful as a Prometheus metric. Each event is also published as an OTel log record on the log rail (message text as body, partition time as timestamp, IBM i severity mapped to SeverityNumber)."

