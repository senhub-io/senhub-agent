# SenHub agent alerting starter pack — agent self-health.
#
# Monitors the monitor: probe health, collection errors, the OTLP
# export pipeline (drops, export errors, buffer growth), disk queues
# for rejected exports, and backend throttling.

groups:
  - name: senhub-agent-health
    rules:
      - alert: AgentProbesUnhealthy
        expr: senhub_agent_probes_healthy < senhub_agent_probes_total
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Unhealthy probes on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "{{ $value }} healthy probes; some configured probes are failing."

      - alert: AgentCollectErrors
        expr: rate(senhub_agent_collect_errors_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Probe collection errors on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "Sustained collection errors; check the agent log."

      - alert: AgentOtlpDroppingData
        expr: rate(senhub_agent_otlp_dropped_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Agent dropping datapoints on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "The OTLP buffer overflowed; the backend is unreachable or too slow. Data is being lost."

      - alert: AgentOtlpExportErrors
        expr: rate(senhub_agent_otlp_export_errors_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OTLP export errors on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "Exports failing for 10 minutes; the buffer is absorbing the backlog for now."

      - alert: AgentOtlpStoreNearCapacity
        # Default max_store_size is 50000; adjust if you changed it.
        expr: senhub_agent_otlp_store_size > 40000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OTLP buffer near capacity on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "Above 80% of the default 50000-point cap; drops start at 100%."

      - alert: AgentOtlpQueueNearCapacity
        # Defaults: metrics 256 MiB, traces 64 MiB; adjust if you
        # changed metrics_queue_max_bytes / traces_queue_max_bytes.
        expr: senhub_agent_otlp_queue_bytes{signal="metrics"} > 0.8 * 268435456 or senhub_agent_otlp_queue_bytes{signal="traces"} > 0.8 * 67108864
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "OTLP disk queue near capacity on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "Metrics or traces disk queue above 80% of its default cap; data is dropped at 100%."

      - alert: AgentOtlpLogsQueueNearCapacity
        # Default logs queue cap is 128 MiB; adjust if you changed
        # logs_queue_max_bytes.
        expr: senhub_agent_otlp_logs_queue_bytes > 0.8 * 134217728
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "OTLP logs disk queue near capacity on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "Logs disk queue above 80% of the default 128 MiB cap; data is dropped at 100%."

      - alert: AgentOtlpQueueNotDraining
        expr: (senhub_agent_otlp_queue_records > 0 and rate(senhub_agent_otlp_queue_replayed_total[15m]) == 0) or (senhub_agent_otlp_logs_queue_records > 0 and rate(senhub_agent_otlp_logs_replayed_total[15m]) == 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "OTLP disk queue not draining on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "The queue is growing with no replay; the backend is not resuming. Data waits on disk and is lost at the cap or at the maximum age (24 h by default)."

      - alert: AgentOtlpThrottled
        expr: rate(senhub_agent_otlp_throttled_total[5m]) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "OTLP exports throttled on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "The backend is asking to slow down (429/503 Retry-After, RetryInfo); the agent waits and keeps data on disk. This is not an export error."

      - alert: AgentRestarted
        expr: senhub_agent_uptime_seconds < 300
        labels:
          severity: info
        annotations:
          summary: "Agent restarted on {{ $labels.host_name }}{{ $labels.instance }}"
          description: "Uptime under 5 minutes. Expected during upgrades; investigate if it repeats."
