---
- name: Tool for the repository key
  ansible.builtin.dnf:
    name: gnupg2
    state: present

- name: Repository key, imported only if its fingerprint matches
  ansible.builtin.rpm_key:
    key: "{{ senhub_agent_repo_key_url }}"
    fingerprint: "{{ senhub_agent_repo_key_fingerprint | replace(' ', '') | upper }}"
    state: present

- name: Repository definition
  ansible.builtin.get_url:
    url: "{{ senhub_agent_repo_url }}/rpm/{{ senhub_agent_channel }}/senhub.repo"
    dest: /etc/yum.repos.d/senhub.repo
    mode: "0644"
    force: true
  register: _senhub_agent_repo

- name: Refresh the package metadata
  ansible.builtin.command: dnf -y makecache --repo senhub-{{ senhub_agent_channel }}
  when: _senhub_agent_repo is changed
  changed_when: false
