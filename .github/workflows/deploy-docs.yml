name: Deploy Documentation

on:
  push:
    branches: [dev, master]
    paths:
      - 'docs/user-guide/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Serialize doc deploys: the dev and master runs both `mike deploy --push` to
# the same agent.senhub.io `main` branch, so two near-simultaneous merges raced
# and the second push was rejected ('fetch first', #581). One shared group with
# cancel-in-progress:false queues runs instead of racing — both publish, in turn.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs source (senhub-agent)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          fetch-depth: 0

      # The versioned docs are published into the landing repo under /docs via
      # mike, which operates on a checkout of that repo. DOCS_DEPLOY_TOKEN must
      # have Contents:write on senhub-io/agent.senhub.io.
      - name: Checkout deploy target (agent.senhub.io)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: senhub-io/agent.senhub.io
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: site
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MkDocs Material + mike (pinned)
        run: pip install "mkdocs-material==9.7.*" "mike==2.2.*"

      - name: Configure git identity
        working-directory: site
        run: |
          git config user.name "senhub-io"
          git config user.email "senhub-io@users.noreply.github.com"

      # A branch that is neither dev nor master has no version line of its
      # own, and treating it as dev is how an integration branch came to
      # overwrite the published dev documentation: two manual runs from
      # integ/release-055 replaced the dev line with that branch's state
      # on 2026-09-14. A manual run from a release or feature branch is
      # therefore refused rather than published somewhere it does not
      # belong.
      - name: Pick version line from branch
        id: ver
        run: |
          case "${GITHUB_REF_NAME}" in
            master) echo "version=latest" >> "$GITHUB_OUTPUT" ;;
            dev)    echo "version=dev"    >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::${GITHUB_REF_NAME} publishes no documentation line." \
                   "Run this workflow from dev or from master; a run from any" \
                   "other branch would overwrite the dev line with that branch."
              exit 1
              ;;
          esac

      # Builds from the source repo's mkdocs.yml and publishes the version into
      # the landing repo's main branch under /docs. mike manages
      # /docs/<version> + /docs/versions.json and leaves the landing root alone.
      - name: Deploy with mike
        working-directory: site
        run: |
          mike deploy \
            --config-file ../src/docs/user-guide/mkdocs.yml \
            --deploy-prefix docs \
            --branch main \
            --push \
            "${{ steps.ver.outputs.version }}"
