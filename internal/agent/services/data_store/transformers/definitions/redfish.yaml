  - name: "hardware.storage.health"
    channel: "storage_health"
    display_name: "Health"
    unit: "#"
    multi_instance_labels: ["storage_id", "host"]
    description: "Health of the storage subsystem"
    category: "storage"
    lookup: "sfs.redfish.health"
    otel:
      name: senhub.hardware.storage.status
      unit: "1"
      type: updowncounter
      expand:
        attribute: senhub.hardware.storage.state
        mapping:
          ok: 0
          degraded: 1
          failed: 2
          unknown: 3
    tag_to_attribute:
      storage_id: hw.id
      storage_name: hw.name

  - name: "hardware.storage.controller.health"
    channel: "storage_controller_health"
    display_name: "Controller Health"
    unit: "#"
    multi_instance_labels: ["controller_id", "controller_name", "host"]
    description: "Storage controller health status"
    category: "storage"
    lookup: "sfs.redfish.health"
    otel:
      name: hw.status
      unit: "1"
      type: updowncounter
      attributes:
        hw.type: disk_controller
      expand:
        attribute: hw.state
        closed: true
        mapping:
          ok: 0
          degraded: 1
          failed: 2
    tag_to_attribute:
      controller_id: hw.id
      controller_name: hw.name

