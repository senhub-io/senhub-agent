name: Go-test
on:
  pull_request:
    branches: [master, 'integ/**']
    paths-ignore:
      - 'docs/**'
      - '*.md'

# Cancel an in-progress run when the same PR is pushed again — no point paying
# for a run that a newer commit has already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux is the primary CI gate and runs on every PR (race detector +
  # govulncheck + boot smoke below also run here). It is the cheapest runner
  # (1x billing).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # gofmt is the authoritative formatter, but nothing enforced it, so
      # drift accumulated silently — five files by the time #717 was
      # picked up, growing one at a time. `go vet` does not cover
      # formatting, hence a dedicated step.
      - name: Gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./app ./cmd ./internal ./probesdk)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean. Run: gofmt -w ./app ./cmd ./internal ./probesdk"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: make test
      # Tests share process-wide registries and counters; a test that only
      # passes in source order shows up here, with the seed in the log.
      - name: Test in random order
        run: go test -shuffle=on -count=1 ./...

  # Race detector runs on linux only. The configuration package was
  # excluded here while it carried 4 documented race flakes; their
  # root cause (lock-free reads of the live config state) was fixed
  # in #268 — the package is back in and validated with 100
  # consecutive clean -race runs.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Test with race detector
        run: go test -race ./...

  # Boot smoke: builds the agent binary, exec's `version` + parses
  # every shipped free-tier example config via `config check`. Catches
  # the kind of bring-up regression that unit tests can't see — linker
  # errors, config-schema-breakage, platform-gate drift.
  boot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Boot smoke
        run: make boot-smoke

  # govulncheck flags known CVEs against the resolved dependency graph
  # (direct + transitive). Fails the pipeline on any finding so that
  # the dependency upgrade is part of the PR that introduced it,
  # rather than a separate maintenance task.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  # golangci-lint analyses one GOOS at a time and the repository ships
  # linux and windows binaries, so both are linted: platform-tagged files
  # are invisible to the other run. The linter is built with the Go
  # toolchain of go.mod so that its gofmt matches `gofmt` used above.
  # darwin is a local-only target and is not gated here.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint (${{ matrix.goos }})
        env:
          GOOS: ${{ matrix.goos }}
        run: make lint
