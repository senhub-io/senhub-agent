{{- include "senhub-agent.checkDaemonSet" . }}
{{- $ds := eq (include "senhub-agent.kind" .) "DaemonSet" }}
apiVersion: apps/v1
kind: {{ include "senhub-agent.kind" . }}
metadata:
  name: {{ include "senhub-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "senhub-agent.labels" . | nindent 4 }}
spec:
  {{- if $ds }}
  # One agent per node, each with its own identity kept in the node's
  # state directory.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  {{- else }}
  # One agent per release, never more: see the head of values.yaml.
  replicas: 1
  # The old pod stops before the new one starts, so two pods never run
  # with one identity, and a ReadWriteOnce state volume can move.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "senhub-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "senhub-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A new configuration or a new chart-managed secret means a new
        # pod: the configuration is built once per pod, at start.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.values }}
        checksum/secrets: {{ include (print $.Template.BasePath "/env-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.hostMonitoring.enabled }}
      # The node's PID and network namespaces: processes, interfaces and
      # their counters are the node's. The node's root filesystem is
      # mounted below for the disks.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- else }}
      hostname: {{ include "senhub-agent.hostname" . }}
      {{- end }}
      serviceAccountName: {{ include "senhub-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "senhub-agent.automountToken" . }}
      # Service links would put <SERVICE>_PORT variables in the agent's
      # environment, some of them named SENHUB_AGENT_*.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if $ds }}
        # The state directory is a hostPath, created root-owned: hand it
        # to the agent's uid. fsGroup does not apply to a hostPath. The
        # only privileges are CAP_CHOWN, and CAP_FOWNER for the chmod of a directory
        # it no longer owns, for this container alone.
        - name: state-owner
          image: {{ include "senhub-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - chown {{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.runAsGroup }} /var/lib/senhub-agent && chmod 0700 /var/lib/senhub-agent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/senhub-agent
        {{- end }}
        # Copies the chart's fragments into the configuration directory.
        # The directory is an emptyDir, not the ConfigMap itself, because
        # the entrypoint and the agent write there: agent.yaml, the
        # default fragments, the secret store key.
        - name: config
          image: {{ include "senhub-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              for src in /senhub-config/*; do
                [ -f "$src" ] || continue
                name=${src##*/}
                case "$name" in
                  *__*) dir=/etc/senhub-agent/${name%%__*}; file=${name#*__} ;;
                  *) dir=/etc/senhub-agent; file=$name ;;
                esac
                mkdir -p "$dir"
                cp "$src" "$dir/$file"
                chmod 0600 "$dir/$file"
                echo "config: $dir/$file"
              done
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-src
              mountPath: /senhub-config
              readOnly: true
            - name: config
              mountPath: /etc/senhub-agent
      containers:
        - name: agent
          image: {{ include "senhub-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            {{- if eq .Values.logLevel "debug" }}
            - --verbose
            {{- with .Values.logFilter }}
            - --filter
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
              protocol: TCP
          env:
            {{- if not $ds }}
            # The identity, from the Secret: SENHUB_HOST_ID is also read by
            # the agent to mark the host identity as configured. A
            # DaemonSet sets neither: each node's key is generated at its
            # first start and kept in the node's state directory, and the
            # host id is the node's machine-id.
            - name: SENHUB_HOST_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "senhub-agent.identitySecretName" . }}
                  key: host-id
            - name: SENHUB_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "senhub-agent.identitySecretName" . }}
                  key: agent-key
            {{- end }}
            {{- if .Values.hostMonitoring.enabled }}
            - name: SENHUB_HOST_ROOT
              value: {{ .Values.hostMonitoring.hostRoot | quote }}
            # gopsutil's own variables: the node's OS release, boot time
            # and sessions are read under the host root. /proc and /sys
            # are already the node's with hostPID and hostNetwork.
            - name: HOST_ETC
              value: {{ printf "%s/etc" .Values.hostMonitoring.hostRoot | quote }}
            - name: HOST_VAR
              value: {{ printf "%s/var" .Values.hostMonitoring.hostRoot | quote }}
            - name: HOST_RUN
              value: {{ printf "%s/run" .Values.hostMonitoring.hostRoot | quote }}
            {{- end }}
            - name: SENHUB_HTTP_PORT
              value: {{ .Values.http.port | quote }}
            - name: SENHUB_HTTP_BIND
              value: {{ .Values.http.bind | quote }}
            {{- with (include "senhub-agent.entrypointEnv" . | fromYamlArray) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.secrets.existingSecret .Values.secrets.values }}
          envFrom:
            {{- with .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if .Values.secrets.values }}
            - secretRef:
                name: {{ include "senhub-agent.envSecretName" . }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/senhub-agent
            - name: state
              mountPath: /var/lib/senhub-agent
            - name: logs
              mountPath: /var/log/senhub-agent
            - name: tmp
              mountPath: /tmp
            {{- if not $ds }}
            # host.id is read from /etc/machine-id. Mounted from the
            # identity Secret, it is the same on every pod of the release
            # and needs no writable root filesystem.
            - name: identity
              mountPath: /etc/machine-id
              subPath: machine-id
              readOnly: true
            {{- end }}
            {{- if .Values.hostMonitoring.enabled }}
            # HostToContainer: the node's submounts (/var, /boot, data
            # disks) appear under the host root, which is how the disk
            # probe finds them.
            - name: host-root
              mountPath: {{ .Values.hostMonitoring.hostRoot }}
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-src
          configMap:
            name: {{ include "senhub-agent.fullname" . }}
        - name: config
          emptyDir: {}
        - name: state
          {{- if $ds }}
          hostPath:
            path: {{ .Values.daemonSet.stateHostPath }}
            type: DirectoryOrCreate
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" (include "senhub-agent.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if not $ds }}
        - name: identity
          secret:
            secretName: {{ include "senhub-agent.identitySecretName" . }}
            defaultMode: 0444
            items:
              - key: host-id
                path: machine-id
        {{- end }}
        {{- if .Values.hostMonitoring.enabled }}
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
