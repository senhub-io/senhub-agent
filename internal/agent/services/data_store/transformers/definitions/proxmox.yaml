probe_name: "proxmox"
friendly_name: "Proxmox VE"
version: "1.0.0"
host_level: false
multi_instance_labels: ["proxmox.node", "proxmox.vmid", "proxmox.vm.name", "proxmox.storage", "proxmox.disk", "proxmox.zfs.pool", "proxmox.task.type"]

# Proxmox VE cluster monitoring via the REST API (FREE tier).
# Covers nodes, QEMU virtual machines, LXC containers, and storage pools.
# Authentication: PVE API token (user@realm!tokenname = UUID).

metrics:

  # ── Availability ─────────────────────────────────────────────────────────────

  - name: "senhub.proxmox.up"
    channel: "proxmox_up"
    display_name: "Proxmox API Up"
    unit: "#"
    category: "availability"
    description: "1 when the Proxmox REST API answered successfully, 0 on any connection or authentication failure"
    otel:
      name: senhub.proxmox.up
      unit: "{status}"
      type: gauge

  # ── Node metrics ─────────────────────────────────────────────────────────────

  - name: "proxmox.node.cpu.utilization"
    channel: "node_{proxmox.node}_cpu"
    display_name: "Proxmox Node {proxmox.node} CPU"
    unit: "%"
    category: "cpu"
    description: "CPU utilization of the Proxmox node in percent (0–100)"
    otel:
      name: proxmox.node.cpu.utilization
      unit: "1"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node

  - name: "proxmox.node.memory.used"
    channel: "node_{proxmox.node}_mem_used"
    display_name: "Proxmox Node {proxmox.node} Memory Used"
    unit: "B"
    category: "memory"
    description: "Bytes of memory currently used on the Proxmox node"
    otel:
      name: proxmox.node.memory.used
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node

  - name: "proxmox.node.memory.total"
    channel: "node_{proxmox.node}_mem_total"
    display_name: "Proxmox Node {proxmox.node} Memory Total"
    unit: "B"
    category: "memory"
    description: "Total installed memory on the Proxmox node"
    otel:
      name: proxmox.node.memory.limit
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node

  - name: "proxmox.node.status"
    channel: "node_{proxmox.node}_status"
    display_name: "Proxmox Node {proxmox.node} Status"
    unit: "#"
    category: "status"
    description: "1 when the node is online, 0 otherwise"
    otel:
      name: proxmox.node.status
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node

  # ── VM / LXC metrics ─────────────────────────────────────────────────────────

  - name: "proxmox.vm.cpu.utilization"
    channel: "vm_{proxmox.vmid}_cpu"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) CPU"
    unit: "%"
    category: "cpu"
    description: "CPU utilization of the VM or LXC container in percent (0–100)"
    otel:
      name: proxmox.vm.cpu.utilization
      unit: "1"
      type: gauge
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.memory.used"
    channel: "vm_{proxmox.vmid}_mem_used"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Memory Used"
    unit: "B"
    category: "memory"
    description: "Bytes of memory currently used by the VM or container"
    otel:
      name: proxmox.vm.memory.used
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.memory.total"
    channel: "vm_{proxmox.vmid}_mem_total"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Memory Total"
    unit: "B"
    category: "memory"
    description: "Total memory allocated to the VM or container"
    otel:
      name: proxmox.vm.memory.limit
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.disk.read"
    channel: "vm_{proxmox.vmid}_disk_read"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Disk Read"
    unit: "B"
    category: "io"
    description: "Cumulative bytes read from disk by the VM or container since last boot"
    otel:
      name: proxmox.vm.disk.read
      unit: "By"
      type: counter
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.disk.write"
    channel: "vm_{proxmox.vmid}_disk_write"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Disk Write"
    unit: "B"
    category: "io"
    description: "Cumulative bytes written to disk by the VM or container since last boot"
    otel:
      name: proxmox.vm.disk.write
      unit: "By"
      type: counter
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.network.in"
    channel: "vm_{proxmox.vmid}_net_in"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Network In"
    unit: "B"
    category: "network"
    description: "Cumulative bytes received on all virtual NICs of the VM or container since last boot"
    otel:
      name: proxmox.vm.network.in
      unit: "By"
      type: counter
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.network.out"
    channel: "vm_{proxmox.vmid}_net_out"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Network Out"
    unit: "B"
    category: "network"
    description: "Cumulative bytes transmitted on all virtual NICs of the VM or container since last boot"
    otel:
      name: proxmox.vm.network.out
      unit: "By"
      type: counter
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.status"
    channel: "vm_{proxmox.vmid}_status"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Status"
    unit: "#"
    category: "status"
    description: "1 when the VM or container is running, 0 otherwise"
    otel:
      name: proxmox.vm.status
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  # ── Storage metrics ───────────────────────────────────────────────────────────

  - name: "proxmox.storage.used"
    channel: "storage_{proxmox.storage}_used"
    display_name: "Proxmox Storage {proxmox.storage} Used"
    unit: "B"
    category: "storage"
    description: "Bytes used on the Proxmox storage pool"
    otel:
      name: proxmox.storage.used
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.storage: proxmox.storage
      proxmox.node: proxmox.node

  - name: "proxmox.storage.total"
    channel: "storage_{proxmox.storage}_total"
    display_name: "Proxmox Storage {proxmox.storage} Total"
    unit: "B"
    category: "storage"
    description: "Total capacity of the Proxmox storage pool"
    otel:
      name: proxmox.storage.limit
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.storage: proxmox.storage
      proxmox.node: proxmox.node

  # ── Disk and ZFS health (needs Sys.Audit on /nodes/{node})  ──

  - name: "proxmox.disk.health"
    channel: "disk_{proxmox.disk}_health"
    display_name: "Proxmox Disk {proxmox.disk} Health"
    unit: "#"
    category: "health"
    description: "1 when the SMART verdict of the physical disk is PASSED or OK, 0 for any other verdict; absent when the disk reports no SMART data. The raw verdict is the proxmox.health attribute"
    otel:
      name: proxmox.disk.health
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.disk: proxmox.disk
      proxmox.disk.type: proxmox.disk.type
      proxmox.disk.model: proxmox.disk.model
      proxmox.disk.serial: proxmox.disk.serial
      proxmox.health: proxmox.health

  - name: "proxmox.disk.wearout"
    channel: "disk_{proxmox.disk}_wearout"
    display_name: "Proxmox Disk {proxmox.disk} Wearout"
    unit: "#"
    category: "health"
    description: "Fraction of the SSD life already used (0 new, 1 worn out); absent when PVE reports N/A"
    otel:
      name: proxmox.disk.wearout
      unit: "1"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.disk: proxmox.disk
      proxmox.disk.type: proxmox.disk.type
      proxmox.disk.model: proxmox.disk.model
      proxmox.disk.serial: proxmox.disk.serial

  - name: "proxmox.zfs.pool.health"
    channel: "zfs_{proxmox.zfs.pool}_health"
    display_name: "Proxmox ZFS Pool {proxmox.zfs.pool} Health"
    unit: "#"
    category: "health"
    description: "1 when the ZFS pool state is ONLINE, 0 for DEGRADED, FAULTED or any other state. The raw state is the proxmox.health attribute"
    otel:
      name: proxmox.zfs.pool.health
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.zfs.pool: proxmox.zfs.pool
      proxmox.health: proxmox.health

  - name: "proxmox.zfs.pool.size"
    channel: "zfs_{proxmox.zfs.pool}_size"
    display_name: "Proxmox ZFS Pool {proxmox.zfs.pool} Size"
    unit: "B"
    category: "storage"
    description: "Total size of the ZFS pool"
    otel:
      name: proxmox.zfs.pool.size
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.zfs.pool: proxmox.zfs.pool

  - name: "proxmox.zfs.pool.used"
    channel: "zfs_{proxmox.zfs.pool}_used"
    display_name: "Proxmox ZFS Pool {proxmox.zfs.pool} Used"
    unit: "B"
    category: "storage"
    description: "Allocated bytes in the ZFS pool"
    otel:
      name: proxmox.zfs.pool.used
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.zfs.pool: proxmox.zfs.pool

  - name: "proxmox.zfs.pool.free"
    channel: "zfs_{proxmox.zfs.pool}_free"
    display_name: "Proxmox ZFS Pool {proxmox.zfs.pool} Free"
    unit: "B"
    category: "storage"
    description: "Free bytes in the ZFS pool"
    otel:
      name: proxmox.zfs.pool.free
      unit: "By"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.zfs.pool: proxmox.zfs.pool

  - name: "proxmox.zfs.pool.fragmentation"
    channel: "zfs_{proxmox.zfs.pool}_frag"
    display_name: "Proxmox ZFS Pool {proxmox.zfs.pool} Fragmentation"
    unit: "#"
    category: "storage"
    description: "Fragmentation of the ZFS pool free space as a fraction (0 to 1)"
    otel:
      name: proxmox.zfs.pool.fragmentation
      unit: "1"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.zfs.pool: proxmox.zfs.pool

  # ── Backups and storage availability ──

  - name: "proxmox.vm.backup.age"
    channel: "vm_{proxmox.vmid}_backup_age"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Last Backup Age"
    unit: "s"
    category: "backup"
    description: "Seconds since the last successful backup of the VM or container, from the newest of its vzdump task history and the backup archives listed on the node storages; absent when no backup is known"
    otel:
      name: proxmox.vm.backup.age
      unit: "s"
      type: gauge
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.vm.backup.last_status"
    channel: "vm_{proxmox.vmid}_backup_status"
    display_name: "Proxmox VM {proxmox.vm.name} ({proxmox.vmid}) Last Backup Status"
    unit: "#"
    category: "backup"
    description: "1 when the last finished vzdump task naming this guest succeeded (warnings included), 0 when it failed; absent when no such task is in the history (a scheduled job covering several guests names none)"
    otel:
      name: proxmox.vm.backup.last_status
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      proxmox.vmid: proxmox.vmid
      proxmox.vm.name: proxmox.vm.name
      proxmox.vm.type: proxmox.vm.type
      proxmox.node: proxmox.node

  - name: "proxmox.storage.active"
    channel: "storage_{proxmox.storage}_active"
    display_name: "Proxmox Storage {proxmox.storage} Active"
    unit: "#"
    category: "storage"
    description: "1 when the storage is active and reachable from the node, 0 otherwise (an unreachable PBS or NFS storage reports 0)"
    otel:
      name: proxmox.storage.active
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      proxmox.storage: proxmox.storage
      proxmox.node: proxmox.node

  # ── Failed tasks ──

  - name: "proxmox.tasks.failed"
    channel: "tasks_failed_{proxmox.task.type}"
    display_name: "Proxmox Failed Tasks {proxmox.task.type}"
    unit: "#"
    category: "tasks"
    description: "Tasks of this type that ended with a status other than OK since the previous collection, per node; each one is also published as an ERROR log record carrying the tail of its task log"
    otel:
      name: proxmox.tasks.failed
      unit: "{task}"
      type: gauge
    tag_to_attribute:
      proxmox.node: proxmox.node
      proxmox.task.type: proxmox.task.type

  - name: "senhub.probe.check.result"
    channel: "check_result"
    display_name: "Check Result"
    unit: "#"
    category: "status"
    description: "Why the last check failed: 0 ok, 1 target down, 2 auth denied, 3 timeout, 4 TLS error, 5 config error, 6 protocol error, 7 permission denied"
    lookup: "senhub.probe.check.result"
    otel:
      name: senhub.probe.check.result
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      service.instance.id: service.instance.id

tag_metadata:
  proxmox.node:
    type: resource
    label: "Node"
  proxmox.vmid:
    type: resource
    label: "VM ID"
  proxmox.vm.name:
    type: resource
    label: "VM Name"
  proxmox.storage:
    type: resource
    label: "Storage Pool"
  proxmox.disk:
    type: resource
    label: "Disk"
  proxmox.disk.type:
    type: category
    label: "Disk Type"
  proxmox.disk.model:
    type: category
    label: "Disk Model"
  proxmox.disk.serial:
    type: category
    label: "Disk Serial"
  proxmox.zfs.pool:
    type: resource
    label: "ZFS Pool"
  proxmox.health:
    type: category
    label: "Reported State"
  proxmox.task.type:
    type: resource
    label: "Task Type"
  metric_type:
    type: category
    label: "Metric Type"

