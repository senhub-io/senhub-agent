# nFPM definition (paths are relative to the repository root) for the Linux .deb / .rpm packages (`make packages`).
#
# Driven by environment variables so one file serves both architectures:
#   VERSION  package version (e.g. 0.6.2, 0.6.2-beta.1)
#   ARCH     amd64 | arm64
#   BIN      path to the matching linux binary
#   UNIT     path to the staged systemd unit (see the Makefile)
#   PKG_NAME, PKG_OTHER, PKG_LICENSE, PKG_EDITION_LABEL  the edition (see the Makefile)
name: ${PKG_NAME}
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: net
priority: optional
maintainer: Sensor Factory <support@senhub.io>
vendor: Sensor Factory
homepage: https://agent.senhub.io
license: ${PKG_LICENSE}
description: |
  SenHub Agent (${PKG_EDITION_LABEL}), infrastructure monitoring agent.
  Single static binary that ships metrics to PRTG, Nagios, Prometheus,
  OTLP, Zabbix and the SenHub cloud.

# One edition at a time: same files, same service. Installing the other
# edition replaces this one and keeps configuration, agent key and data.
conflicts:
  - ${PKG_OTHER}
replaces:
  - ${PKG_OTHER}
provides:
  - ${PKG_OTHER}

contents:
  - src: ${BIN}
    expand: true
    dst: /usr/bin/senhub-agent
    file_info:
      mode: 0755
  - src: ${UNIT}
    expand: true
    dst: /usr/lib/systemd/system/senhub-agent.service
    file_info:
      mode: 0644
  # The operator's files. type: config is a dpkg conffile and an
  # %config(noreplace) entry, so edits survive upgrade and removal.
  # auto_update.enabled is false in agent.yaml: the package manager owns
  # the version. Owned by senhub, like `senhub-agent install` leaves them:
  # the agent rewrites them itself (admin key, licence sidecar, console).
  - dst: /etc/senhub-agent
    type: dir
    file_info:
      mode: 0750
      owner: senhub
      group: senhub
  - src: packaging/nfpm/conf/agent.yaml
    dst: /etc/senhub-agent/agent.yaml
    type: config|noreplace
    file_info:
      mode: 0600
      owner: senhub
      group: senhub
  - src: packaging/nfpm/conf/probes.d/00-host.yaml
    dst: /etc/senhub-agent/probes.d/00-host.yaml
    type: config|noreplace
    file_info:
      mode: 0600
      owner: senhub
      group: senhub
  - src: packaging/nfpm/conf/strategies.d/00-http.yaml
    dst: /etc/senhub-agent/strategies.d/00-http.yaml
    type: config|noreplace
    file_info:
      mode: 0600
      owner: senhub
      group: senhub
  - dst: /etc/senhub-agent/probes.d
    type: dir
    file_info:
      mode: 0750
      owner: senhub
      group: senhub
  - dst: /etc/senhub-agent/strategies.d
    type: dir
    file_info:
      mode: 0750
      owner: senhub
      group: senhub
  - dst: /var/lib/senhub-agent
    type: dir
    file_info:
      mode: 0750
      owner: senhub
      group: senhub
  - dst: /var/log/senhub-agent
    type: dir
    file_info:
      mode: 0750
      owner: senhub
      group: senhub

scripts:
  preinstall: packaging/nfpm/scripts/preinstall.sh
  postinstall: packaging/nfpm/scripts/postinstall.sh
  preremove: packaging/nfpm/scripts/preremove.sh
  postremove: packaging/nfpm/scripts/postremove.sh

overrides:
  deb:
    depends:
      - systemd
  rpm:
    depends:
      - systemd

rpm:
  group: Applications/System
deb:
  fields:
    Bugs: https://github.com/senhub-io/senhub-agent/issues
