{{- if not .Values.identity.existingSecret }}
{{- $name := include "senhub-agent.identitySecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $hostId := "" }}
{{- if .Values.identity.hostId }}
{{- $hostId = .Values.identity.hostId | replace "-" "" | lower }}
{{- if not (regexMatch "^[0-9a-f]{32}$" $hostId) }}
{{- fail "identity.hostId must be 32 hexadecimal characters, dashes optional" }}
{{- end }}
{{- else if hasKey $data "host-id" }}
{{- $hostId = index $data "host-id" | b64dec }}
{{- else }}
{{- $hostId = uuidv4 | replace "-" "" }}
{{- end }}
{{- $agentKey := "" }}
{{- if .Values.identity.agentKey }}
{{- $agentKey = .Values.identity.agentKey | lower }}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $agentKey) }}
{{- fail "identity.agentKey must be a UUID such as e313cd19-45d9-4711-8b09-3f58ac6e7595" }}
{{- end }}
{{- else if hasKey $data "agent-key" }}
{{- $agentKey = index $data "agent-key" | b64dec }}
{{- else }}
{{- $agentKey = uuidv4 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "senhub-agent.labels" . | nindent 4 }}
  annotations:
    # The identity outlives the release: reinstalling the chart brings the
    # same host and the same agent back. Delete the Secret to start over.
    helm.sh/resource-policy: keep
type: Opaque
data:
  host-id: {{ $hostId | b64enc | quote }}
  agent-key: {{ $agentKey | b64enc | quote }}
{{- end }}
