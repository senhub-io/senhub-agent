tag_metadata:
  psu_name:
    type: resource
    label: "Power Supply"
    linked_categories: ["power"]
  drive_name:
    type: resource
    label: "Drive"
    linked_categories: ["drives"]
  volume_name:
    type: resource
    label: "Volume"
    linked_categories: ["volumes"]
  pool_name:
    type: resource
    label: "Storage Pool"
    linked_categories: ["pools"]
  controller_id:
    type: resource
    label: "Controller"
  # System tags (injected by framework)
  host:
    type: resource
    label: "Host"
  os:
    type: resource
    label: "Operating System"
  platform:
    type: resource
    label: "Platform"
  probe_name:
    type: resource
    label: "Probe Name"
  probe_type:
    type: resource
    label: "Probe Type"
