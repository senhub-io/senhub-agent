    display_name: "Volume IO Read Latency"
    unit: "#"
    multi_instance_labels: ["volume_name", "volume_id", "controller_id", "pool_name", "raid_type", "host"]
    description: "Volume read latency"
    category: "volumes"
    otel:
      skip: true
      reason: "The BMC states no unit for this value (Dell PowerVault returns a bare number, the Redfish schema a duration string), so a conversion to seconds could be off by orders of magnitude. Still reaches PRTG unconverted; export once a real array has fixed the unit."

