  # ============================================================
  - name: "ibmi.message_queue.event"
    channel: "ibmi_msgq_event"
    display_name: "QSYSOPR Message"
    prtg_skip: true
    unit: "#"
    category: "events"
    description: "A message reached QSYSOPR; carries the message identifier and text as attributes"
    otel:
      skip: true
      reason: "Event conduit — relayed QSYSOPR message. Not meaningful as a Prometheus metric. Each event is also published as an OTel log record on the log rail (message text as body, partition time as timestamp, IBM i severity mapped to SeverityNumber)."

  - name: "ibmi.history_log.event"
    channel: "ibmi_history_event"
    display_name: "QHST Event"
    prtg_skip: true
    unit: "#"
    category: "events"
    description: "An entry was written to the history log QHST"
    otel:
      skip: true
      reason: "Event conduit — relayed QHST history event. Not meaningful as a Prometheus metric. Each event is also published as an OTel log record on the log rail (message text as body, partition time as timestamp, IBM i severity mapped to SeverityNumber)."

  - name: "ibmi.audit_journal.event"
