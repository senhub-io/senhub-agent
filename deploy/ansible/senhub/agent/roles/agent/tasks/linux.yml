---
- name: Repository
  ansible.builtin.include_tasks: "repo_{{ ansible_facts['os_family'] | lower }}.yml"
  when: senhub_agent_manage_repository | bool

# Under --check a repository that is not set up yet stays unset, so the
# package cannot be resolved; the install is reported instead of tried.
- name: Repository a real run would add
  ansible.builtin.set_fact:
    _senhub_agent_repo_pending: >-
      {{ ansible_check_mode and ((_senhub_agent_list | default({})) is changed
                                 or (_senhub_agent_repo | default({})) is changed) }}

- name: Packages installed
  ansible.builtin.package_facts:
    manager: auto

- name: Edition currently installed
  ansible.builtin.set_fact:
    _senhub_agent_swap: "{{ _senhub_agent_other_package in ansible_facts['packages'] and _senhub_agent_package not in ansible_facts['packages'] }}"

- name: Configuration checked before the package replaces an agent installed without it
  ansible.builtin.include_tasks: preflight_linux.yml
  when:
    - not ansible_check_mode
    - _senhub_agent_package not in ansible_facts['packages']
    - _senhub_agent_other_package not in ansible_facts['packages']

- name: Switch edition (RHEL family)
  ansible.builtin.command: "dnf -y swap {{ _senhub_agent_other_package }} {{ _senhub_agent_package }}"
  when: _senhub_agent_swap | bool and ansible_facts['os_family'] == 'RedHat'
  changed_when: true
  notify: senhub_agent restart

- name: Switch edition (SUSE)
  ansible.builtin.command: "zypper --non-interactive install --force-resolution {{ _senhub_agent_package }}"
  when: _senhub_agent_swap | bool and ansible_facts['os_family'] == 'Suse'
  changed_when: true
  notify: senhub_agent restart

- name: Package a real run would install
  ansible.builtin.debug:
    msg: "Check mode: {{ _senhub_agent_package }} would be installed from the repository added by this run."
  when: _senhub_agent_repo_pending | bool
  changed_when: true

- name: Install the agent (apt)
  ansible.builtin.apt:
    name: "{{ _senhub_agent_package }}{{ ('=' ~ _senhub_agent_pkg_version ~ '*') if _senhub_agent_pinned | bool else '' }}"
    state: "{{ 'latest' if _senhub_agent_follow_latest | bool else 'present' }}"
    allow_downgrade: "{{ _senhub_agent_pinned | bool }}"
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian' and not (_senhub_agent_repo_pending | bool)

- name: Install the agent (dnf)
  ansible.builtin.dnf:
    name: "{{ _senhub_agent_package }}{{ ('-' ~ _senhub_agent_pkg_version) if _senhub_agent_pinned | bool else '' }}"
    state: "{{ 'latest' if _senhub_agent_follow_latest | bool else 'present' }}"
    allow_downgrade: "{{ _senhub_agent_pinned | bool }}"
  when: ansible_facts['os_family'] == 'RedHat' and not (_senhub_agent_repo_pending | bool)

- name: Install the agent (zypper)
  community.general.zypper:
    name: "{{ _senhub_agent_package }}{{ ('=' ~ _senhub_agent_pkg_version) if _senhub_agent_pinned | bool else '' }}"
    state: "{{ 'latest' if _senhub_agent_follow_latest | bool else 'present' }}"
    force_resolution: "{{ _senhub_agent_pinned | bool }}"
  when: ansible_facts['os_family'] == 'Suse' and not (_senhub_agent_repo_pending | bool)

# The configuration is checked by the installed agent; under --check on a
# host where the package is not installed yet there is none to ask.
- name: Agent binary
  ansible.builtin.stat:
    path: "{{ senhub_agent_bin }}"
  register: _senhub_agent_bin_file

- name: Configuration a real run would write
  ansible.builtin.debug:
    msg: "Check mode: {{ senhub_agent_bin }} is not installed yet, so the configuration is neither built nor checked."
  when: ansible_check_mode and not _senhub_agent_bin_file.stat.exists

- name: Configuration
  ansible.builtin.include_tasks: configure_linux.yml
  when: not ansible_check_mode or _senhub_agent_bin_file.stat.exists

- name: Apply pending restarts before the final state
  ansible.builtin.meta: flush_handlers

- name: Service enabled and running
  ansible.builtin.service:
    name: "{{ senhub_agent_service_name }}"
    enabled: "{{ senhub_agent_service_enabled | bool }}"
    state: "{{ senhub_agent_service_state }}"
  # Under --check on a host without the agent there is no service yet.
  when: not (ansible_check_mode and not _senhub_agent_bin_file.stat.exists)
