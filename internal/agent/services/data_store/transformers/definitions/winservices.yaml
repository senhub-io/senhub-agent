probe_name: "winservices"
friendly_name: "Windows Services"
version: "1.0.0"
host_level: true
universal: true

# Free host-local probe: Windows service state via the SCM API.
# One instance per service name (windows.service.name tag).
# windows.service.state is a binary running/not-running gauge (1/0).
# windows.service.status carries the raw SCM numeric state (1-7).
# windows.service.start_type carries how the service is configured to start.
# The dimension is declared on the per-service metrics only: senhub.winservices.up
# is the probe's own heartbeat and carries no service name.

metrics:
  - name: "host.service.running"
    platforms: ["windows"]
    channel: "windows_service_{windows.service.name}_running"
    display_name: "Service {windows.service.name} Running"
    unit: "#"
    multi_instance_labels: ["windows.service.name"]
    category: "service"
    description: "1 when the service runs, 0 when it does not (stopped, failed, starting, stopping or paused), the same series for systemd and Windows"
    lookup: "host.service.running"
    otel:
      name: host.service.running
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      host.service.name: host.service.name

  - name: "senhub.winservices.up"
    platforms: ["windows"]
    channel: "winservices_up"
    display_name: "Windows Services SCM Up"
    unit: "#"
    category: "status"
    description: "1 when the Service Control Manager is reachable and the probe completed its cycle"
    otel:
      name: senhub.winservices.up
      unit: "{status}"
      type: gauge

  - name: "windows.service.state"
    platforms: ["windows"]
    channel: "windows_service_{windows.service.name}_state"
    display_name: "Service {windows.service.name} Running"
    unit: "#"
    multi_instance_labels: ["windows.service.name"]
    category: "service"
    description: "1 when the service is in the Running state, 0 otherwise"
    otel:
      name: windows.service.state
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      windows.service.name: windows.service.name

  - name: "windows.service.status"
    platforms: ["windows"]
    channel: "windows_service_{windows.service.name}_status"
    display_name: "Service {windows.service.name} Status"
    unit: "#"
    multi_instance_labels: ["windows.service.name"]
    category: "service"
    lookup: "windows.service.status"
    description: "Numeric SCM state of the service: 1=stopped 2=start_pending 3=stop_pending 4=running 5=continue_pending 6=pause_pending 7=paused"
    otel:
      name: windows.service.status
      unit: "{state}"
      type: gauge
    tag_to_attribute:
      windows.service.name: windows.service.name

  - name: "windows.service.start_type"
    platforms: ["windows"]
    channel: "windows_service_{windows.service.name}_start_type"
    display_name: "Service {windows.service.name} Start Type"
    unit: "#"
    multi_instance_labels: ["windows.service.name"]
    category: "service"
    prtg_skip: true
    lookup: "windows.service.start_type"
    description: "How the service is configured to start: 0=boot 1=system 2=automatic 3=manual 4=disabled 5=automatic (delayed start)"
    otel:
      name: windows.service.start_type
      unit: "{type}"
      type: gauge
    tag_to_attribute:
      windows.service.name: windows.service.name

  - name: "senhub.probe.check.result"
    platforms: ["windows"]
    channel: "check_result"
    display_name: "Check Result"
    unit: "#"
    category: "status"
    lookup: "senhub.probe.check.result"
    description: "Why the last check failed: 0 ok, 1 target down, 2 auth denied, 3 timeout, 4 TLS error, 5 config error, 6 protocol error, 7 permission denied"
    otel:
      name: senhub.probe.check.result
      unit: "{status}"
      type: gauge

# Windows runs some services only when something asks for them, and keeps
# per-session copies of others whose names change at every logon; those
# stay out of discovery by default.
discovery_filters:
  - label: "windows.service.name"
    match_macro: "{$SENHUB.WINSERVICES.MATCHES}"
    exclude_macro: "{$SENHUB.WINSERVICES.NOT_MATCHES}"
    exclude_default: "^(sppsvc|clr_optimization_.*|gupdate|gupdatem|edgeupdate|edgeupdatem|MapsBroker|TrustedInstaller|RemoteRegistry|.*_[0-9a-f]{4,8})$"
    description: "Service short names"

triggers:
  - name: "Service {#WINDOWS_SERVICE_NAME} is set to start automatically and is not running"
    expression: "max({{host.service.running}},{$SENHUB.WINSERVICES.GRACE})=0"
    priority: AVERAGE
    scope: availability
    description: "Raised when a watched service has not been running for the whole grace period. With no list configured the probe watches only the services set to start automatically (delayed or not). Services Windows starts on demand, or per session, are kept out of discovery by {$SENHUB.WINSERVICES.NOT_MATCHES}."
    macros:
      - name: "{$SENHUB.WINSERVICES.GRACE}"
        value: "5m"
        description: "How long an automatic service must have been stopped before it raises a problem; covers a restart and the delayed start after a boot"
