probe_name: "tcp_dial"
friendly_name: "TCP Dial"
version: "1.0.0"
host_level: false
multi_instance_labels: ["target"]

# Free active-check probe (#159): measured TCP connect per host:port.
# Local targets are read from the TCP table instead of dialed.

metrics:
  - name: "senhub.tcpdial.up"
    channel: "tcpdial_up"
    display_name: "TCP {target} Up"
    unit: "#"
    category: "availability"
    description: "1 when the TCP connect completed within the timeout"
    otel:
      name: senhub.tcpdial.up
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      target: tcpdial.target

  - name: "senhub.tcpdial.duration"
    channel: "tcpdial_duration"
    display_name: "TCP {target} Connect Time"
    unit: "ms"
    category: "latency"
    description: "Time for the TCP three-way handshake to complete"
    otel:
      name: senhub.tcpdial.duration
      unit: "s"
      type: gauge
      value_scale: 0.001
    tag_to_attribute:
      target: tcpdial.target

  - name: "senhub.probe.check.result"
    channel: "check_result"
    display_name: "Check Result"
    unit: "#"
    category: "availability"
    description: "Why the last check failed: 0 ok, 1 target down, 2 auth denied, 3 timeout, 4 TLS error, 5 config error, 6 protocol error, 7 permission denied"
    lookup: "senhub.probe.check.result"
    otel:
      name: senhub.probe.check.result
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      target: tcpdial.target


  - name: "senhub.probe.check.target.unresolved"
    channel: "check_target_unresolved"
    display_name: "Check Target Unresolved"
    unit: "#"
    category: "availability"
    description: "1 when a local target is not listening and the check failed with connection refused"
    lookup: "senhub.probe.check.target.unresolved"
    otel:
      name: senhub.probe.check.target.unresolved
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      target: tcpdial.target

  - name: "senhub.tcp.listener.up"
    channel: "tcp_listener_up"
    display_name: "TCP {target} Listener Up"
    unit: "#"
    category: "availability"
    description: "1 when a socket is in LISTEN on the local port, read from the TCP table"
    otel:
      name: senhub.tcp.listener.up
      unit: "{status}"
      type: gauge
    tag_to_attribute:
      target: tcpdial.target
      server.port: server.port
      network.transport: network.transport
      process.executable.name: process.executable.name

  - name: "senhub.tcp.listener.connections"
    channel: "tcp_listener_connections"
    display_name: "TCP {target} Listener Connections"
    unit: "{connection}"
    category: "availability"
    description: "ESTABLISHED sockets on the local port, read from the TCP table"
    otel:
      name: senhub.tcp.listener.connections
      unit: "{connection}"
      type: gauge
    tag_to_attribute:
      target: tcpdial.target
      server.port: server.port
      network.transport: network.transport
      network.connection.state: network.connection.state

  - name: "senhub.tcp.listener.peers"
    channel: "tcp_listener_peers"
    display_name: "TCP {target} Listener Peers"
    unit: "{peer}"
    category: "availability"
    description: "Distinct remote IPs with an ESTABLISHED socket on the local port"
    otel:
      name: senhub.tcp.listener.peers
      unit: "{peer}"
      type: gauge
    tag_to_attribute:
      target: tcpdial.target
      server.port: server.port
      network.transport: network.transport
